# Production profile — activated via SPRING_PROFILES_ACTIVE=prod
# Overrides application.yml for production-specific settings.
# Properties not defined here inherit from application.yml.

spring:
  # Secrets are mounted by Docker as files under /run/secrets and read here as a
  # property source, one property per file name. They never pass through an
  # environment variable, which is the whole point: Docker records `environment`
  # verbatim in Config.Env, where `docker inspect` exposes it to anyone able to
  # query the daemon, permanently and regardless of file permissions.
  #
  # No `optional:` prefix on purpose. A missing directory must stop the
  # application, not start it on whatever defaults happen to be reachable.
  config:
    import: configtree:/run/secrets/

  datasource:
    # DB_HOST defaults to "mysql" — the Docker Compose service name.
    # On the Docker internal network, services reach each other by name.
    # useSSL=false — both containers are on the same private Docker network,
    # SSL between containers on the same host adds no security benefit.
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:taskflow}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    # No defaults — it MUST be provided, and the application refuses to start
    # if they are missing. DB_USERNAME stays an environment variable: a user name
    # is not a credential and its exposure in `docker inspect` grants nothing.
    username: ${DB_USERNAME}
    # Read from /run/secrets/db.password, not from DB_PASSWORD.
    #
    # The property is deliberately not named spring.datasource.password. Naming
    # it so would let application.yml's ${DB_PASSWORD:root} fill the gap when the
    # secret file is absent: the API would start on the default, serve traffic and
    # report healthy, with a clean `docker inspect` to prove nothing was leaked.
    # A distinct name with no default turns that same absence into an
    # unresolvable placeholder and a refused startup.
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # validate — Flyway manages the schema. Hibernate only checks that
      # entity mappings match the existing schema. Never auto-creates or
      # drops tables in production.
      ddl-auto: validate
    # Never log SQL in production — performance overhead and potential
    # sensitive data exposure in logs.
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    # Disabled — session is closed after the service layer.
    # Prevents unintended lazy-loading outside transactions.
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # baseline-on-migrate — allows Flyway to run on a pre-existing database
    # that was not initially managed by Flyway.
    baseline-on-migrate: true

server:
  port: 8082
  error:
    # Disable Spring Boot's default HTML error page.
    # All errors are handled by GlobalExceptionHandler returning JSON.
    whitelabel:
      enabled: false

application:
  jwt:
    # Read from /run/secrets/jwt.secret, not from JWT_SECRET, for the same reason
    # as the database password and with more at stake: this key signs the tokens,
    # so anyone reading it forges a valid session for any account without ever
    # touching the database. No default, so a missing file refuses startup.
    secret: ${jwt.secret}
    # Default 15 minutes — short-lived tokens reduce exposure window.
    expiration: ${JWT_EXPIRATION:900000}
  cookie:
    # Defaults to true in production — cookies only sent over HTTPS.
    secure: ${COOKIE_SECURE:true}
  refresh-token:
    # Default 7 days — balances security and user experience.
    expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}

springdoc:
  api-docs:
    # Path of the generated OpenAPI document consumed by Swagger UI and Redoc.
    path: /v3/api-docs
  swagger-ui:
    # Redirection path, not the resource path. Springdoc registers a redirect
    # from this value to the bundled webjar, resolving it relatively. Setting it
    # to /swagger-ui/index.html made the effective URL
    # /swagger-ui/swagger-ui/index.html. /swagger-ui is the correct value.
    path: /swagger-ui
    # Makes Swagger UI send credentials on Try it out requests, which is what
    # attaches the HttpOnly jwt and refreshToken cookies. Without it the request
    # goes out unauthenticated and every protected endpoint answers 401, even
    # once CORS accepts the origin.
    with-credentials: true

# ── CORS ───────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
