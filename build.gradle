plugins {
    id 'java'
    // Spring Boot 3.5.16, dernière version OSS de la ligne 3.5 (25 juin 2026).
    // La branche 3.5 est en fin de vie open source depuis le 30 juin 2026 :
    // aucun correctif supplémentaire ne sera publié sur Maven Central. Maintien
    // volontaire en 3.x, passer en 4.x implique Spring Framework 7 et relève
    // d'une issue dédiée. Ce BOM apporte Spring Framework 6.2.19 (corrige
    // CVE-2026-41855) et Spring Security 6.5.11 (série d'avis de juin 2026).
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    // Checkstyle — enforces Java code style conventions
    id 'checkstyle'
    // OWASP Dependency Check — scans dependencies for known CVEs.
    // Raised from 12.2.2 to 13.0.0 alongside the gate being closed: a security
    // tool that lags is a poor thing to make blocking. The upgrade does not
    // clear the five findings on the plugin's own build classpath, verified on
    // 20 August 2026 — 13.0.0 carries the same vulnerable transitives, which is
    // why the section 3 suppressions in config/owasp/suppressions.xml stay.
    // The major bump moved the report from build/reports to
    // build/reports/dependency-check; ci-cd.yml was corrected accordingly.
    id 'org.owasp.dependencycheck' version '13.0.0'
    // Spotless — rewrites source files to a fixed format. Checkstyle only
    // reports, it never corrects; this is the tool that does the correcting.
    // The two must agree on the same convention, otherwise each undoes the
    // other's work on every build.
    id 'com.diffplug.spotless' version '7.0.2'
}

jacoco {
    toolVersion = "0.8.11"
}

checkstyle {
    toolVersion = "10.21.4"
    // Configuration file defining the rules to enforce
    configFile = file("config/checkstyle/checkstyle.xml")
    // Fail the build on any violation. Two properties are needed, not one.
    // ignoreFailures alone is not enough: the Gradle Checkstyle task fails on
    // violations of `error` severity, and checkstyle.xml sets the Checker
    // severity to `warning`, so every violation arrives as a warning. Warnings
    // are compared against maxWarnings, whose default is Integer.MAX_VALUE.
    // Leaving that default would give a task that never fails and a pipeline
    // that checks nothing while reporting success.
    ignoreFailures = false
    // maxWarnings rather than switching severity to `error` in checkstyle.xml:
    // severity describes how grave a rule is, the threshold describes the
    // policy of the project. Conflating them removes the ability to downgrade a
    // single rule to a warning the day that is warranted.
    maxWarnings = 0
    // Show violations in the console output
    showViolations = true
}

spotless {
    java {
        // Restricted to our own sources. Without this, Spotless would also
        // pick up anything generated under build/, rewriting files that are
        // regenerated on the next build.
        target 'src/**/*.java'

        // AOSP variant of google-java-format, not the Google variant.
        // google-java-format takes no configuration options by design: the
        // only choice is which of the two variants to apply. Google indents
        // with 2 spaces, AOSP with 4. The existing sources are indented with
        // 4, so the Google variant would reindent all 62 Java files and make
        // every line of the project point at a single formatting commit in
        // git blame.
        // Both wrap at 100 columns, where checkstyle.xml allows 120. Keeping
        // Checkstyle at 120 leaves the formatter stricter than the checker,
        // which is stable. The reverse, a formatter more permissive than the
        // checker, would loop forever: the formatter would produce lines the
        // checker rejects, on every run.
        googleJavaFormat('1.25.2').aosp()

        // Removes unused imports and expands star imports, which
        // AvoidStarImport, UnusedImports and RedundantImport all report.
        removeUnusedImports()

        // Trailing whitespace and a final newline, which NewlineAtEndOfFile
        // reports on 34 files.
        trimTrailingWhitespace()
        endWithNewline()
    }
}

dependencyCheck {
    // Fail the build if a dependency has a CVSS score >= 9 (Critical)
    failBuildOnCVSS = 9
    // Output formats — HTML for humans, JSON for CI tools
    formats = ['HTML', 'JSON']
    // Skip test dependencies — they are not shipped to production
    skipTestGroups = true
    // Suppression file — documents known false positives and non-exploitable CVEs
    // Each suppression includes a justification and an expiry date for re-evaluation
    suppressionFile = 'config/owasp/suppressions.xml'
    // NVD API key — speeds up CVE database updates significantly
    nvd {
        // API key read from environment variable — never hardcoded
        apiKey = System.getenv('NVD_API_KEY') ?: ''
        // Delay between NVD API requests in milliseconds
        // 2000ms with API key (default), 8000ms without
        delay = 2000
    }
    analyzers {
        // Sonatype OSS Index disabled — requires authentication since Sept 2025
        // NVD via OWASP Dependency Check provides equivalent CVE coverage
        ossIndex {
            enabled = false
        }
    }
}

tasks.jacocoTestReport {
    dependsOn test  // ensures tests run before report generation
    reports {
        html.required = true
        html.outputLocation = layout.buildDirectory.dir("reports/jacoco/html")
        xml.required = true   // required by CI/CD tools (Codecov, etc.)
        csv.required = true   // useful for custom coverage badge generation
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/dto/**',
                    '**/*Application*',
                    '**/config/**',
                    '**/*Exception*'
            ])
        }))
    }
}

tasks.test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport  // generates coverage report after tests
}

group = 'com.mehdi.taskflow'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    // Forcé à 10.1.57 : le BOM 3.5.16 gère encore Tomcat 10.1.55, affecté par
    // CVE-2026-53434 (CRL invalides silencieusement ignorées sur un connecteur
    // FFM). Corrigé en 10.1.56, 10.1.57 est la version 10.1.x courante.
    // Non exploitable ici, le connecteur FFM exige Java 22+ et nous tournons en
    // Java 21 sur le connecteur NIO par défaut, mais la NVD le score à 9.1, ce
    // qui déclenche failBuildOnCVSS = 9. Surcharge à retirer seulement si le
    // projet passe un jour sur un BOM gérant 10.1.56 ou supérieur.
    set('tomcat.version', '10.1.57')
    // Forcé à 2.21.5 : le BOM 3.5.16 gère jackson-bom 2.21.2, affecté par la
    // série databind de juin 2026, CVE-2026-54512 (contournement du
    // PolymorphicTypeValidator), CVE-2026-54513, CVE-2026-54514 et
    // CVE-2026-54515. La 2.21.4 couvre les trois premières, la 2.21.5 est
    // nécessaire pour CVE-2026-54515. Surcharger la propriété du BOM plutôt
    // qu'un artefact isolé garde tous les modules Jackson alignés.
    // À retirer dès qu'un BOM géré livre 2.21.5 ou supérieur.
    set('jackson-bom.version', '2.21.5')
    // Forced to 3.18.0 to fix CVE-2025-48924 (StackOverflowError in ClassUtils)
    set('commons-lang3.version', '3.18.0')
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // JPA / Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // MySQL JDBC driver, pinned to 26.7.0 rather than the version managed by the
    // Spring Boot BOM (9.7.0), which is affected by four Connector/J advisories:
    // CVE-2026-60586, CVE-2026-60623, CVE-2026-60624 and CVE-2026-61082, all
    // covering 9.7.0 to 9.7.1. Oracle switched to calendar versioning after the
    // 9.7 LTS series, so 26.7.0 is the next release, not a major rewrite.
    // Supported against MySQL Server 8.4 and later, which is what production and
    // the Testcontainers suite now run. Remove this pin once a managed BOM ships
    // 26.7.0 or later.
    runtimeOnly 'com.mysql:mysql-connector-j:26.7.0'
    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    // Swagger / OpenAPI, pinned to 2.9.0 rather than the 2.8.8 previously in
    // place. That version bundled swagger-ui 5.21.0, itself bundling DOMPurify
    // 3.2.4, which carried eighteen CVEs plus GHSA-55q2-fjhq-7xh7 and accounted
    // for the entire Dependency-Check report: two bundle files, nineteen
    // identifiers each, thirty-eight findings. 2.9.0 brings swagger-ui 5.32.11,
    // where DOMPurify is patched.
    // Still on the 2.x line, which targets Spring Boot 3.x; the 3.x line
    // targets Spring Boot 4 and is out of reach until that migration happens.
    // Verified against Spring Boot 3.5.16 by starting the context and
    // exercising Try it out, not inferred from release notes: a Springdoc
    // incompatibility shows up at context startup, never at compile time.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'
    // Test
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Testcontainers — spins up a disposable MySQL container for integration tests.
    // Required because ON DELETE cascade rules are enforced by the database engine:
    // a Mockito mock cannot prove them, and H2 would not prove them on MySQL.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:junit-jupiter'
    // Rate Limiting
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    // OWASP Java HTML Sanitizer — XSS prevention on user input
    // Keeping version 20220608.1 — CVE-2025-66021 affects noscript/style tags
    // which are not used in our HtmlPolicyBuilder — no patch available yet
    implementation('com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20220608.1') {
        exclude group: 'com.google.guava', module: 'guava'
    }
    implementation 'com.google.guava:guava:33.2.1-jre'
    // Actuator — exposes /actuator/health for container healthchecks and monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Apache Commons Text — HTML entity decoding after OWASP sanitization (e.g. &#39; → ')
    implementation 'org.apache.commons:commons-text:1.12.0'

    // OAuth2 — planned feature, not yet implemented
    // implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
}
